version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-recommendation-system
    ports:
      - "5000:5000"
    volumes:
      - ./Artifacts:/app/Artifacts
      - ./templates:/app/templates
      - ./static:/app/static
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
    command: python app.py
    stdin_open: true
    tty: true
    restart: unless-stopped
